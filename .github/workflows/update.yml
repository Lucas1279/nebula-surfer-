name: Auto-update NebulaSurfer catalog

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nebula-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow requests

      - name: Rebuild index.html if a newer release exists
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update.py

      - name: Commit and push the updated site
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          if git diff --quiet -- index.html; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "NebulaSurfer bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update catalog to ${VERSION:-latest}"
          git push
